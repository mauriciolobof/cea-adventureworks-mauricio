version: 2
sources:
  - {
      name: adventure_works,
      database: fea_academy,
      schema: adventure_works,
      description: "Dados brutos da Adventure Works no Unity Catalog (schema único; tabelas prefixadas pelo schema de origem no Postgres: sales, person, production, humanresources).",
      tables:
        [
          {
            name: sales_salesorderheader,
            description: "Cabeçalho dos pedidos de venda. Grão: 1 linha por pedido.",
            columns:
              [
                {
                  name: salesorderid,
                  description: "Chave primária do pedido.",
                  tests: [unique, not_null],
                },
                {
                  name: customerid,
                  description: "FK para sales_customer.",
                  tests:
                    [
                      not_null,
                      {
                        relationships:
                          {
                            to: "source('adventure_works', 'sales_customer')",
                            field: customerid,
                          },
                      },
                    ],
                },
                {
                  name: orderdate,
                  description: "Data do pedido — usada na dim_date.",
                  tests: [not_null],
                },
                { name: status, description: "Status do pedido." },
              ],
          },
          {
            name: sales_salesorderdetail,
            description: "Itens de cada pedido. Grão: 1 linha por item (grão da fct_sales).",
            columns:
              [
                {
                  name: salesorderdetailid,
                  description: "Chave primária do item.",
                  tests: [unique, not_null],
                },
                {
                  name: salesorderid,
                  description: "FK para sales_salesorderheader.",
                  tests:
                    [
                      not_null,
                      {
                        relationships:
                          {
                            to: "source('adventure_works', 'sales_salesorderheader')",
                            field: salesorderid,
                          },
                      },
                    ],
                },
                {
                  name: productid,
                  description: "FK para production_product.",
                  tests:
                    [
                      not_null,
                      {
                        relationships:
                          {
                            to: "source('adventure_works', 'production_product')",
                            field: productid,
                          },
                      },
                    ],
                },
                { name: orderqty, tests: [not_null] },
                { name: unitprice, tests: [not_null] },
                { name: unitpricediscount },
              ],
          },
          {
            name: sales_salesorderheadersalesreason,
            description: "Tabela ponte M:N entre pedidos e motivos de venda.",
            columns:
              [
                {
                  name: salesorderid,
                  tests:
                    [
                      not_null,
                      {
                        relationships:
                          {
                            to: "source('adventure_works', 'sales_salesorderheader')",
                            field: salesorderid,
                          },
                      },
                    ],
                },
                {
                  name: salesreasonid,
                  tests:
                    [
                      not_null,
                      {
                        relationships:
                          {
                            to: "source('adventure_works', 'sales_salesreason')",
                            field: salesreasonid,
                          },
                      },
                    ],
                },
              ],
          },
          {
            name: sales_salesreason,
            description: "Motivos de venda.",
            columns:
              [
                { name: salesreasonid, tests: [unique, not_null] },
                { name: name, tests: [not_null] },
              ],
          },
          {
            name: sales_customer,
            description: "Clientes — podem ser pessoa física (personid preenchido) ou loja.",
            columns:
              [
                { name: customerid, tests: [unique, not_null] },
                {
                  name: personid,
                  description: "FK para person_person (nulo quando o cliente é uma loja).",
                },
              ],
          },
          {
            name: sales_creditcard,
            description: "Cartões de crédito usados nos pedidos.",
            columns:
              [
                { name: creditcardid, tests: [unique, not_null] },
                { name: cardtype, tests: [not_null] },
              ],
          },
          {
            name: sales_salesperson,
            description: "Vendedores.",
            columns: [{ name: businessentityid, tests: [unique, not_null] }],
          },
          {
            name: person_person,
            description: "Pessoas (clientes, vendedores, funcionários).",
            columns:
              [
                { name: businessentityid, tests: [unique, not_null] },
                { name: firstname, tests: [not_null] },
                { name: lastname, tests: [not_null] },
              ],
          },
          {
            name: person_address,
            description: "Endereços.",
            columns:
              [
                { name: addressid, tests: [unique, not_null] },
                { name: city, tests: [not_null] },
                {
                  name: stateprovinceid,
                  tests:
                    [
                      not_null,
                      {
                        relationships:
                          {
                            to: "source('adventure_works', 'person_stateprovince')",
                            field: stateprovinceid,
                          },
                      },
                    ],
                },
              ],
          },
          {
            name: person_stateprovince,
            description: "Estados/províncias.",
            columns:
              [
                { name: stateprovinceid, tests: [unique, not_null] },
                { name: name, tests: [not_null] },
                {
                  name: countryregioncode,
                  tests:
                    [
                      not_null,
                      {
                        relationships:
                          {
                            to: "source('adventure_works', 'person_countryregion')",
                            field: countryregioncode,
                          },
                      },
                    ],
                },
              ],
          },
          {
            name: person_countryregion,
            description: "Países/regiões.",
            columns:
              [
                { name: countryregioncode, tests: [unique, not_null] },
                { name: name, tests: [not_null] },
              ],
          },
          {
            name: production_product,
            description: "Produtos.",
            columns:
              [
                { name: productid, tests: [unique, not_null] },
                { name: name, tests: [not_null] },
                {
                  name: productsubcategoryid,
                  description: "FK para production_productsubcategory (pode ser nulo).",
                },
              ],
          },
          {
            name: production_productsubcategory,
            description: "Subcategorias de produto.",
            columns:
              [
                { name: productsubcategoryid, tests: [unique, not_null] },
                {
                  name: productcategoryid,
                  tests:
                    [
                      not_null,
                      {
                        relationships:
                          {
                            to: "source('adventure_works', 'production_productcategory')",
                            field: productcategoryid,
                          },
                      },
                    ],
                },
              ],
          },
          {
            name: production_productcategory,
            description: "Categorias de produto.",
            columns:
              [
                { name: productcategoryid, tests: [unique, not_null] },
                { name: name, tests: [not_null] },
              ],
          },
          {
            name: humanresources_employee,
            description: "Funcionários (usado para identificar o vendedor).",
            columns: [{ name: businessentityid, tests: [unique, not_null] }],
          },
        ],
    }
